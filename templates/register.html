<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <style>
        /* Global reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body style */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212; /* Dark background */
            color: #fff; /* White text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
            padding: 20px;
        }

        h1 {
            font-size: 2rem;
            color: #ffa500; /* Orange title color */
            margin-bottom: 20px;
        }

        form {
            background-color: #1f1f1f; /* Dark grey form background */
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 1rem;
            color: #ccc; /* Lighter grey for labels */
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px 0;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #333; /* Dark input background */
            color: #fff;
            font-size: 1rem;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #ffa500; /* Orange focus border */
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #ffa500; /* Orange button */
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #e68a00; /* Darker orange on hover */
        }

        a {
            color: #ffa500; /* Orange link */
            text-decoration: none;
            font-size: 1rem;
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            h1 {
                font-size: 1.5rem;
            }

            form {
                width: 90%;
            }

            button {
                font-size: 1rem;
            }

            input[type="email"],
            input[type="password"] {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <h1>Inscription</h1>
    <form method="POST">
        <label for="email">Email :</label>
        <input type="email" name="email" required>
        <label for="password">Mot de passe :</label>
        <input type="password" name="password" required>
        <button type="submit">S'inscrire</button>
    </form>
    <p><a href="/">Retour à l'accueil</a></p>
</body>
</html>
