<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Confirmé</title>
    <style>
        /* General body styling */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #121212; /* Dark background */
            color: #f5f5f5; /* Light text for contrast */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        /* Main heading styling */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #00b0f0; /* Bright color for emphasis */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
        }

        /* Paragraph styling */
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-align: center;
            color: #f0f0f0;
        }

        /* Strong text (for email) styling */
        strong {
            color: #00b0f0; /* Highlight email address */
        }

        /* Link styling */
        a {
            color: #00b0f0;
            text-decoration: none;
            font-size: 1rem;
            display: block;
            text-align: center;
            margin-top: 20px;
        }

        /* Link hover effect */
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Confirmation d'email</h1>
    <p>Un email de confirmation a été envoyé à <strong>{{ email }}</strong>.</p>
    <p>Veuillez vérifier votre boîte de réception et suivre les instructions pour confirmer votre email.</p>
    <p><a href="/" class="link">Retour à l'accueil</a></p>
</body>
</html>
